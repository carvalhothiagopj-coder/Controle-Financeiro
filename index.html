<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanças">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Finanças Pessoais</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   TEMA: variáveis de cor (claro por padrão, escuro automático ou manual)
   ===================================================================== */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --surface-2:#eff1f5; --ink:#151822; --ink-2:#454c5e;
  --muted:#667085; --line:#e1e4eb;
  --in:#087a43; --in-soft:#e2f4ea;
  --out:#c62a24; --out-soft:#fcebea;
  --card:#5246d1; --card-soft:#ecebfc;
  --debt:#1f5fd0; --debt-soft:#e6eefc;
  --warn:#9a5200; --warn-soft:#fff1d6;
  --focus:#5246d1; --fab:#151822; --fab-ink:#ffffff; --scrim:rgba(10,12,20,.5);
  color-scheme: light dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d0f15; --surface:#171a23; --surface-2:#1f232e; --ink:#eef0f6; --ink-2:#c4c9d8;
    --muted:#8f96aa; --line:#2a2f3d;
    --in:#3ccf84; --in-soft:#10301f;
    --out:#ff7d73; --out-soft:#3b1917;
    --card:#a198ff; --card-soft:#26234d;
    --debt:#7fb0ff; --debt-soft:#1a2a4a;
    --warn:#ffb454; --warn-soft:#3a2a10;
    --focus:#a198ff; --fab:#eef0f6; --fab-ink:#0d0f15; --scrim:rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0d0f15; --surface:#171a23; --surface-2:#1f232e; --ink:#eef0f6; --ink-2:#c4c9d8;
  --muted:#8f96aa; --line:#2a2f3d;
  --in:#3ccf84; --in-soft:#10301f;
  --out:#ff7d73; --out-soft:#3b1917;
  --card:#a198ff; --card-soft:#26234d;
  --debt:#7fb0ff; --debt-soft:#1a2a4a;
  --warn:#ffb454; --warn-soft:#3a2a10;
  --focus:#a198ff; --fab:#eef0f6; --fab-ink:#0d0f15; --scrim:rgba(0,0,0,.65);
}
:root[data-theme="light"]{ color-scheme: light; }
html{ background:var(--bg); height:100%; scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%; }

/* =====================================================================
   BASE
   ===================================================================== */
*,*::before,*::after{ box-sizing:border-box; }
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  font-size:15px; line-height:1.45; font-variant-numeric:tabular-nums;
}
body.lock{ overflow:hidden; }
h1,h2,h3{ margin:0; line-height:1.2; letter-spacing:-.01em; }
h1{ font-size:22px; font-weight:800; }
h2{ font-size:17px; font-weight:700; }
h3{ font-size:15px; font-weight:700; }
p{ margin:0; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; border-radius:6px; }
[hidden]{ display:none !important; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.muted{ color:var(--muted); }
.in{ color:var(--in); } .out{ color:var(--out); } .cardc{ color:var(--card); } .debtc{ color:var(--debt); }
.num{ font-variant-numeric:tabular-nums; white-space:nowrap; }

/* =====================================================================
   ESTRUTURA: topo, navegação, conteúdo
   ===================================================================== */
.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bg);
  border-bottom:1px solid var(--line);
}
.top-in{ max-width:1040px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
.brand{ display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px; letter-spacing:-.02em; }
.mark{ display:inline-flex; align-items:flex-end; gap:3px; height:22px; }
.mark i{ display:block; width:6px; border-radius:2px; }
.mark i:nth-child(1){ height:12px; background:var(--in); }
.mark i:nth-child(2){ height:22px; background:var(--card); }
.mark i:nth-child(3){ height:16px; background:var(--out); }
#saveflag{ font-size:12px; color:var(--muted); }

#nav{
  position:fixed; left:0; right:0; bottom:0; z-index:30; display:grid; grid-template-columns:repeat(7,1fr);
  background:var(--surface); border-top:1px solid var(--line);
  padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));
}
#nav button{
  background:none; border:0; padding:6px 0; display:flex; flex-direction:column; align-items:center; gap:2px;
  color:var(--muted); font-size:10px; font-weight:600; border-radius:10px; min-width:0;
}
#nav button svg{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
#nav button[aria-current="page"]{ color:var(--ink); }
#nav button[aria-current="page"] svg{ stroke:var(--card); stroke-width:2.2; }
#nav .l-full{ display:none; } #nav .l-short{ display:inline; }

.wrap{ max-width:1040px; margin:0 auto; padding:14px 16px 150px; }
.page-h{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:4px 0 14px; flex-wrap:wrap; }
.stack{ display:flex; flex-direction:column; gap:14px; }
.grid2{ display:grid; grid-template-columns:1fr; gap:14px; }
.grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.grid2s{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }

@media (min-width:900px){
  #nav{ top:env(safe-area-inset-top,0px); right:auto; width:224px; grid-template-columns:1fr; align-content:start; gap:2px; padding:18px 12px; border-top:0; border-right:1px solid var(--line); }
  #nav button{ flex-direction:row; gap:12px; font-size:14px; padding:11px 12px; justify-content:flex-start; }
  #nav .l-full{ display:inline; } #nav .l-short{ display:none; }
  #nav button[aria-current="page"]{ background:var(--surface-2); }
  .top-in,.wrap{ margin-left:calc(224px + max(0px,(100% - 224px - 1040px)/2)); margin-right:auto; }
  .top-in{ width:calc(100% - 224px); max-width:1040px; }
  .wrap{ width:calc(100% - 224px); max-width:1040px; padding-bottom:80px; }
  .grid2{ grid-template-columns:1fr 1fr; }
}

/* =====================================================================
   COMPONENTES
   ===================================================================== */
.panel{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; }
.panel > h2,.panel > .ph{ margin-bottom:12px; }
.ph{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.sub{ font-size:13px; color:var(--muted); }
.lbl{ font-size:12.5px; color:var(--muted); font-weight:600; }

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); padding:10px 14px; border-radius:11px; font-weight:700; font-size:14px; line-height:1.1; min-height:42px;
}
.btn:hover{ background:var(--surface-2); }
.btn.pri{ background:var(--card); border-color:var(--card); color:#fff; }
.btn.pri:hover{ filter:brightness(1.08); background:var(--card); }
:root[data-theme="dark"] .btn.pri{ color:#0d0f15; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn.pri{ color:#0d0f15; } }
.btn.dng{ color:var(--out); border-color:var(--out); background:transparent; }
.btn.dng.solid{ background:var(--out); color:#fff; }
:root[data-theme="dark"] .btn.dng.solid{ color:#0d0f15; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn.dng.solid{ color:#0d0f15; } }
.btn.sm{ padding:7px 10px; min-height:34px; font-size:13px; border-radius:9px; }
.btn.good{ color:var(--in); border-color:var(--in); background:transparent; }
.btn[disabled]{ opacity:.5; cursor:not-allowed; }
.link{ background:none; border:0; padding:0; color:var(--card); font-weight:700; text-decoration:underline; text-underline-offset:3px; font-size:13px; }
.icon-btn{ width:40px; height:40px; border-radius:11px; border:1px solid var(--line); background:var(--surface); display:inline-flex; align-items:center; justify-content:center; padding:0; }
.icon-btn svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }

.mnav{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0 0 14px; }
.mnav-l{ text-align:center; display:flex; flex-direction:column; gap:2px; align-items:center; }
.mnav-l strong{ font-size:18px; font-weight:800; letter-spacing:-.01em; }

.badge{ display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:999px; font-size:11.5px; font-weight:700; background:var(--surface-2); color:var(--ink-2); white-space:nowrap; }
.badge.in{ background:var(--in-soft); color:var(--in); }
.badge.out{ background:var(--out-soft); color:var(--out); }
.badge.cardc{ background:var(--card-soft); color:var(--card); }
.badge.debtc{ background:var(--debt-soft); color:var(--debt); }
.badge.warn{ background:var(--warn-soft); color:var(--warn); }

/* ---- Resumo: faixa de saldo ---- */
.hero{ padding:18px 16px 16px; }
.hero .big{ font-size:clamp(30px,8.5vw,44px); font-weight:800; letter-spacing:-.03em; line-height:1.05; margin:6px 0 14px; }
.split{ display:flex; height:10px; border-radius:6px; overflow:hidden; background:var(--surface-2); gap:2px; }
.split i{ display:block; height:100%; }
.split .si{ background:var(--in); } .split .so{ background:var(--out); }
.split-l{ display:flex; justify-content:space-between; gap:10px; margin-top:8px; font-size:13px; font-weight:700; }
.stat{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px; min-width:0; }
.stat .v{ font-size:clamp(12.5px,3.5vw,19px); font-weight:800; margin-top:4px; letter-spacing:-.02em; white-space:nowrap; }
.stat .s{ font-size:12px; color:var(--muted); margin-top:2px; }
.stat.tint-c{ background:var(--card-soft); border-color:transparent; }
.stat.tint-c .lbl,.stat.tint-c .s{ color:var(--ink-2); }
.stat.tint-c .v{ color:var(--card); }

.bar{ height:10px; border-radius:6px; background:var(--surface-2); overflow:hidden; }
.bar > i{ display:block; height:100%; border-radius:6px; background:var(--card); min-width:0; }
.bar.green > i{ background:var(--in); } .bar.red > i{ background:var(--out); } .bar.blue > i{ background:var(--debt); } .bar.amber > i{ background:var(--warn); }

.alerts{ display:flex; flex-direction:column; gap:8px; }
.alert{ display:flex; gap:10px; align-items:flex-start; padding:11px 12px; border-radius:12px; font-size:14px; font-weight:600; border:1px solid transparent; }
.alert svg{ width:20px; height:20px; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; margin-top:1px; }
.alert.danger{ background:var(--out-soft); color:var(--out); }
.alert.warn{ background:var(--warn-soft); color:var(--warn); }
.alert.info{ background:var(--card-soft); color:var(--card); }
.alert .a-t{ flex:1; min-width:0; }
.alert .a-t small{ display:block; font-weight:500; opacity:.9; margin-top:2px; }

.banner{ display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap; padding:11px 14px; border-radius:12px; background:var(--card-soft); color:var(--ink); font-size:14px; }

/* ---- Listas ---- */
.list{ list-style:none; margin:0; padding:0; }
.row{ display:grid; grid-template-columns:1fr auto; gap:4px 12px; padding:12px 0; border-top:1px solid var(--line); align-items:start; }
.row:first-child{ border-top:0; padding-top:2px; }
.row .r-t{ font-weight:700; overflow-wrap:anywhere; }
.row .r-m{ display:flex; flex-wrap:wrap; gap:4px 10px; font-size:12.5px; color:var(--muted); margin-top:2px; align-items:center; }
.row .r-v{ font-weight:800; text-align:right; white-space:nowrap; }
.row .r-a{ grid-column:1 / -1; display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
.empty{ padding:18px 8px; text-align:center; color:var(--muted); font-size:14px; }
.empty b{ display:block; color:var(--ink); margin-bottom:4px; }

.seg{ display:inline-flex; background:var(--surface-2); border-radius:12px; padding:3px; gap:2px; max-width:100%; }
.seg button{ border:0; background:transparent; padding:8px 14px; border-radius:9px; font-weight:700; font-size:13.5px; color:var(--ink-2); min-height:36px; }
.seg button[aria-pressed="true"]{ background:var(--surface); color:var(--ink); box-shadow:0 0 0 1px var(--line); }
.seg button.t-in[aria-pressed="true"]{ background:var(--in); color:#fff; box-shadow:none; }
.seg button.t-out[aria-pressed="true"]{ background:var(--out); color:#fff; box-shadow:none; }
:root[data-theme="dark"] .seg button.t-in[aria-pressed="true"],:root[data-theme="dark"] .seg button.t-out[aria-pressed="true"]{ color:#0d0f15; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .seg button.t-in[aria-pressed="true"],:root:not([data-theme="light"]) .seg button.t-out[aria-pressed="true"]{ color:#0d0f15; } }
.seg.full{ display:flex; } .seg.full button{ flex:1; }

/* ---- Formulários ---- */
.fld{ display:flex; flex-direction:column; gap:5px; margin-bottom:12px; min-width:0; }
.fld > label{ font-size:13px; font-weight:700; color:var(--ink-2); }
.fld .hint{ font-size:12.5px; color:var(--muted); }
.err{ font-size:12.5px; color:var(--out); font-weight:600; min-height:0; }
.err:empty{ display:none; }
input[type=text],input[type=search],input[type=date],input[type=number],input[type=month],select,textarea{
  width:100%; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:11px; padding:10px 12px; min-height:44px; font-size:16px;
}
textarea{ min-height:76px; resize:vertical; }
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{ border-color:var(--out); }
.two{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.chk{ display:flex; gap:10px; align-items:center; font-weight:600; font-size:14px; margin-bottom:12px; }
.chk input{ width:20px; height:20px; accent-color:var(--card); }
.filters{ display:flex; flex-direction:column; gap:10px; }
.frow{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
@media (min-width:700px){ .frow{ grid-template-columns:repeat(4,1fr); } }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ display:inline-flex; align-items:center; gap:6px; padding:6px 6px 6px 12px; border-radius:999px; background:var(--surface-2); font-weight:600; font-size:13.5px; }
.chip button{ border:0; background:var(--surface); width:24px; height:24px; border-radius:50%; line-height:1; color:var(--muted); font-weight:800; }
.chip.lock{ padding-right:12px; }
.inline-add{ display:flex; gap:8px; margin-top:10px; }

/* ---- Gráficos ---- */
.chart svg{ width:100%; height:auto; display:block; }
.donut-wrap{ display:grid; grid-template-columns:1fr; gap:12px; align-items:center; }
@media (min-width:520px){ .donut-wrap{ grid-template-columns:200px 1fr; } }
.donut{ max-width:220px; margin:0 auto; }
.d-l{ fill:var(--muted); font-size:11px; font-weight:600; } .d-v{ fill:var(--ink); font-size:15px; font-weight:800; }
.legend{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px; font-size:13.5px; }
.legend li{ display:grid; grid-template-columns:12px 1fr auto auto; gap:8px; align-items:center; }
.legend i{ width:12px; height:12px; border-radius:4px; display:block; }
.legend .pc{ color:var(--muted); width:38px; text-align:right; font-size:12.5px; }
.b-in{ fill:var(--in); } .b-out{ fill:var(--out); }
.ax{ fill:var(--muted); font-size:11px; font-weight:600; }
.gridl{ stroke:var(--line); stroke-width:1; }
.ln{ fill:none; stroke:var(--card); stroke-width:3; stroke-linejoin:round; stroke-linecap:round; }
.ar{ fill:var(--card); opacity:.12; }
.dot{ fill:var(--card); }
.zero{ stroke:var(--muted); stroke-width:1; stroke-dasharray:4 4; }
.key{ display:flex; gap:14px; font-size:12.5px; color:var(--muted); font-weight:600; margin-top:6px; }
.key i{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; }
.hb{ display:grid; grid-template-columns:110px 1fr auto; gap:10px; align-items:center; padding:6px 0; font-size:13.5px; }
.hb .n{ font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hb .bar{ height:12px; }

table.tb{ width:100%; border-collapse:collapse; font-size:13.5px; }
table.tb th{ text-align:right; font-size:12px; color:var(--muted); font-weight:700; padding:6px 6px; border-bottom:1px solid var(--line); }
table.tb td{ text-align:right; padding:8px 6px; border-bottom:1px solid var(--line); white-space:nowrap; }
table.tb th:first-child,table.tb td:first-child{ text-align:left; }
.scroll-x{ overflow-x:auto; max-width:100%; }

/* ---- Cartões / dívidas ---- */
.ccard{ display:flex; flex-direction:column; gap:12px; }
.ccard .top-r{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
.ccard .name{ font-weight:800; font-size:17px; }
.kv{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.kv > div{ min-width:0; }
.kv .k{ font-size:12px; color:var(--muted); font-weight:600; }
.kv .vv{ font-weight:800; overflow-wrap:anywhere; }
.acts{ display:flex; flex-wrap:wrap; gap:8px; }
.sched{ border-top:1px solid var(--line); margin-top:4px; }
.sched .srow{ display:grid; grid-template-columns:46px 1fr auto; gap:8px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
.sched .srow:last-child{ border-bottom:0; }
.sched .srow.paid{ color:var(--muted); }
.big-pct{ font-size:40px; font-weight:800; letter-spacing:-.03em; line-height:1; }

/* ---- FAB, modal, toast ---- */
.fab{
  position:fixed; right:16px; bottom:calc(74px + env(safe-area-inset-bottom,0px)); z-index:25; border:0; background:var(--fab); color:var(--fab-ink);
  height:52px; padding:0 18px 0 14px; border-radius:26px; display:inline-flex; align-items:center; gap:8px; font-weight:800; font-size:15px;
  box-shadow:0 6px 20px rgba(0,0,0,.28);
}
.fab svg{ width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2.6; stroke-linecap:round; }
@media (min-width:900px){ .fab{ bottom:24px; right:28px; } }
.modal{ position:fixed; inset:0; z-index:50; background:var(--scrim); display:flex; align-items:flex-end; justify-content:center; }
.modal[hidden]{ display:none !important; }
.sheet{
  background:var(--surface); width:100%; max-width:560px; max-height:92vh; max-height:92dvh; display:flex; flex-direction:column;
  border-radius:20px 20px 0 0; border:1px solid var(--line); outline:none;
}
@media (min-width:700px){ .modal{ align-items:center; padding:20px; } .sheet{ border-radius:20px; max-height:88vh; } }
.sheet-h{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); }
.sheet-b{ padding:16px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.sheet-f{ display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--line); }
.sheet-f:empty{ display:none; }
.sheet-f .btn{ flex:1 1 auto; }
@media (min-width:700px){ .sheet-f .btn{ flex:0 0 auto; } }
.note-box{ background:var(--surface-2); border-radius:11px; padding:10px 12px; font-size:13.5px; color:var(--ink-2); margin-bottom:12px; }
.note-box.card{ background:var(--card-soft); }
#toasts{ position:fixed; left:0; right:0; bottom:calc(84px + env(safe-area-inset-bottom,0px)); z-index:60; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; padding:0 16px; }
@media (min-width:900px){ #toasts{ bottom:28px; } }
.toast{ background:var(--ink); color:var(--bg); padding:11px 16px; border-radius:12px; font-size:14px; font-weight:600; max-width:440px; pointer-events:auto; }
.toast.err{ background:var(--out); color:#fff; }
textarea.code{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; min-height:180px; }
@media (prefers-reduced-motion: no-preference){
  .bar > i{ transition:width .35s ease; }
}

function donutSVG(slices) {
  const total = slices.reduce((s, x) => s + x.value, 0); if (total <= 0) return '';
  const R = 70, Cc = 2 * Math.PI * R; let acc = 0, circles = '';
  slices.forEach(s => {
    const len = s.value / total * Cc;
    circles += '<circle cx="100" cy="100" r="' + R + '" fill="none" stroke="' + s.color + '" stroke-width="30" stroke-dasharray="' + len.toFixed(3) + ' ' + (Cc - len).toFixed(3) + '" stroke-dashoffset="' + (-acc).toFixed(3) + '" transform="rotate(-90 100 100)"><title>' + esc(s.name) + ': ' + money(s.value) + '</title></circle>';
    acc += len;
  });
  return '<svg viewBox="0 0 200 200" class="donut" role="img" aria-label="Gastos por categoria">' + circles + '<text x="100" y="95" text-anchor="middle" class="d-l">Total</text><text x="100" y="117" text-anchor="middle" class="d-v">' + money(total) + '</text></svg>';
}
function barsSVG(rows) {
  const W = 360, H = 190, pl = 6, pr = 6, pt = 12, pb = 26;
  const max = Math.max(1, ...rows.map(r => Math.max(r.a, r.b))); const n = rows.length; const gw = (W - pl - pr) / n; const bw = Math.min(18, gw * 0.32);
  let s = '<line class="gridl" x1="0" x2="' + W + '" y1="' + (H - pb) + '" y2="' + (H - pb) + '"/>';
  rows.forEach((r, i) => {
    const cx = pl + gw * i + gw / 2; const ha = r.a / max * (H - pt - pb), hb = r.b / max * (H - pt - pb);
    s += '<rect class="b-in" x="' + (cx - bw - 1).toFixed(1) + '" y="' + (H - pb - ha).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + ha.toFixed(1) + '" rx="3"><title>Entradas em ' + esc(r.label) + ': ' + money(r.a) + '</title></rect>';
    s += '<rect class="b-out" x="' + (cx + 1).toFixed(1) + '" y="' + (H - pb - hb).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + hb.toFixed(1) + '" rx="3"><title>Saídas em ' + esc(r.label) + ': ' + money(r.b) + '</title></rect>';
    s += '<text class="ax" x="' + cx.toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(r.label) + '</text>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Entradas e saídas por mês">' + s + '</svg><div class="key"><span><i style="background:var(--in)"></i>Entradas</span><span><i style="background:var(--out)"></i>Saídas</span></div>';
}
function lineSVG(pts) {
  if (!pts.length) return '';
  const W = 360, H = 190, pl = 8, pr = 8, pt = 16, pb = 26;
  const vals = pts.map(p => p.v); const min = Math.min(0, ...vals), max = Math.max(0, ...vals); const span = (max - min) || 1;
  const x = i => pts.length === 1 ? W / 2 : pl + (W - pl - pr) * i / (pts.length - 1);
  const y = v => pt + (max - v) / span * (H - pt - pb);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  const area = line + ' L' + x(pts.length - 1).toFixed(1) + ' ' + y(0).toFixed(1) + ' L' + x(0).toFixed(1) + ' ' + y(0).toFixed(1) + ' Z';
  let s = '<line class="zero" x1="0" x2="' + W + '" y1="' + y(0).toFixed(1) + '" y2="' + y(0).toFixed(1) + '"/><path class="ar" d="' + area + '"/><path class="ln" d="' + line + '"/>';
  pts.forEach((p, i) => { s += '<circle class="dot" cx="' + x(i).toFixed(1) + '" cy="' + y(p.v).toFixed(1) + '" r="4"><title>' + esc(p.label) + ': ' + money(p.v) + '</title></circle><text class="ax" x="' + x(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(p.label) + '</text>'; });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Evolução do saldo acumulado">' + s + '</svg>';
}

function filteredTx() {
  const f = ui.f; const q = norm(f.q);
  const list = state.tx.filter(t => {
    if (f.type !== 'all' && t.type !== f.type) return false;
    if (f.cat !== 'all' && t.cat !== f.cat) return false;
    if (f.status !== 'all' && t.status !== f.status) return false;
    if (f.who && f.who !== 'all' && t.who !== f.who) return false;
    if (f.acct && f.acct !== 'all' && t.accountId !== f.acct) return false;
    if (f.period === 'month' && ymOf(t.date) !== ui.ym) return false;
    if (f.period === 'custom') { if (f.from && t.date < f.from) return false; if (f.to && t.date > f.to) return false; }
    if (q && norm(t.desc + ' ' + t.cat + ' ' + (t.note || '') + ' ' + (t.place || '') + ' ' + (t.who || '') + ' ' + (t.tags || []).join(' ')).indexOf(q) < 0) return false;
    return true;
  });
  const S = { 'date-desc': (a, b) => b.date.localeCompare(a.date), 'date-asc': (a, b) => a.date.localeCompare(b.date), 'val-desc': (a, b) => b.amount - a.amount, 'val-asc': (a, b) => a.amount - b.amount, 'desc': (a, b) => a.desc.localeCompare(b.desc, 'pt-BR') };

}

}

function stackedBarsSVG(rows) {

function relMonths() { const a = []; for (let i = ui.relN - 1; i >= 0; i--) a.push(ymAdd(ui.ym, -i)); return a; }
function renderRelatorios() {
  const ms = relMonths(); const datas = ms.map(monthData);
  let h = '<div class="page-h"><h1>Relatórios</h1><div class="seg" role="group" aria-label="Período">' + [3, 6, 12].map(n => '<button data-a="rel-range" data-n="' + n + '" aria-pressed="' + (ui.relN === n) + '">' + n + ' meses</button>').join('') + '</div></div>';
  h += monthNav('Até ' + ymLabel(ui.ym)) + '<div class="stack">';
  // Comparativo mensal
  h += '<section class="panel chart"><h2>Comparativo mensal</h2>' + barsSVG(ms.map((k, i) => ({ label: ymShort(k), a: datas[i].sumIn, b: datas[i].sumOut }))) +
    '<div class="scroll-x" style="margin-top:12px"><table class="tb"><thead><tr><th>Mês</th><th>Entradas</th><th>Saídas</th><th>Saldo</th></tr></thead><tbody>' + ms.map((k, i) => { const n = r2(datas[i].sumIn - datas[i].sumOut); return '<tr><td>' + ymShort(k) + '/' + k.slice(2, 4) + '</td><td class="in">' + money(datas[i].sumIn) + '</td><td class="out">' + money(datas[i].sumOut) + '</td><td class="' + (n < 0 ? 'out' : 'in') + '"><b>' + signed(n) + '</b></td></tr>'; }).join('') + '</tbody></table></div></section>';
  // Categorias
  const allOuts = [].concat.apply([], datas.map(d => d.outs.filter(t => !t.pigId))); const cats = catTotals(allOuts); const tot = cats.reduce((s, x) => s + x.value, 0); const mx = cats.length ? cats[0].value : 1;
  h += '<section class="panel"><h2>Gastos por categoria</h2><p class="sub" style="margin-bottom:8px">Soma dos ' + ui.relN + ' meses: ' + money(tot) + '</p>' + (cats.length ? cats.map(c => '<div class="hb"><span class="n" title="' + esc(c.name) + '">' + esc(catLabel(c.name)) + '</span><div class="bar" aria-hidden="true"><i style="width:' + (c.value / mx * 100).toFixed(1) + '%;background:' + catColor(c.name) + '"></i></div><span class="num">' + money(c.value) + ' <span class="muted">' + PCT0.format(c.value / tot) + '</span></span></div>').join('') : empty('Sem saídas no período', '')) + '</section>';
  // Evolução do saldo
  h += '<section class="panel chart"><h2>Evolução do saldo</h2>' + lineSVG(ms.map(k => ({ label: ymShort(k), v: cumulative(k) }))) + '<p class="sub" style="margin-top:6px">Saldo acumulado ao fim de cada mês, incluindo o saldo inicial.</p></section>';
  // Comprometimento da renda
  const cm = commitOf(ui.ym); const tone = cm.pct == null ? '' : cm.pct > 0.5 ? 'red' : cm.pct > 0.3 ? 'amber' : 'green';
  h += '<section class="panel"><h2>Comprometimento da renda</h2><p class="sub" style="margin-bottom:10px">Parcelas de cartão e dívidas do mês ÷ entradas do mês.</p>' +
    (cm.pct == null ? empty('Sem entradas em ' + ymLabel(ui.ym).toLowerCase(), 'Cadastre entradas para calcular o percentual.') : '<div class="big-pct num ' + (tone === 'red' ? 'out' : tone === 'green' ? 'in' : '') + '">' + PCT1.format(cm.pct) + '</div><p class="sub" style="margin:6px 0 10px">' + money(cm.inst) + ' em parcelas de ' + money(cm.inc) + ' de entradas.</p>' + barHTML(cm.pct, tone)) +
    '<div class="scroll-x" style="margin-top:14px"><table class="tb"><thead><tr><th>Mês</th><th>Parcelas</th><th>Entradas</th><th>%</th></tr></thead><tbody>' + ms.map(k => { const c = commitOf(k); return '<tr><td>' + ymShort(k) + '/' + k.slice(2, 4) + '</td><td>' + money(c.inst) + '</td><td>' + money(c.inc) + '</td><td><b>' + (c.pct == null ? '—' : PCT0.format(c.pct)) + '</b></td></tr>'; }).join('') + '</tbody></table></div></section>';
  // Outras visões: pessoa, tipo de gasto, necessidade, juros
  {
    const from = ymFirst(ms[0]), to = ymLast(ui.ym);
    const ex = state.tx.filter(t => t.type === 'out' && !t.fromInvoice && !t.fromDebt && !t.pigId && t.date >= from && t.date <= to);
    const fees = r2(state.tx.filter(t => t.date >= from && t.date <= to).reduce((x, t) => x + (t.fees || 0), 0));
    const by = (fn) => { const m = {}; ex.forEach(t => { const k = fn(t); if (k) m[k] = r2((m[k] || 0) + t.amount); }); return m; };
    const hb = (m, color) => { const a = Object.keys(m).map(k => ({ n: k, v: m[k] })).sort((x, y) => y.v - x.v); const tt = a.reduce((x, y) => x + y.v, 0); const mx = a.length ? a[0].v : 1; return a.length ? a.map(c => '<div class="hb"><span class="n" title="' + esc(c.n) + '">' + esc(c.n) + '</span><div class="bar" aria-hidden="true"><i style="width:' + (c.v / mx * 100).toFixed(1) + '%;background:' + color + '"></i></div><span class="num">' + money(c.v) + ' <span class="muted">' + PCT0.format(c.v / tt) + '</span></span></div>').join('') : '<div class="sub">Sem dados informados neste período.</div>'; };
    h += '<section class="panel"><h2>Outras visões dos gastos</h2><p class="sub" style="margin-bottom:10px">Considera os gastos lançados com essas informações, pela data da compra ou conta.</p>' +
      '<h3 style="margin:8px 0 2px">Por responsável</h3>' + hb(by(t => t.who), 'var(--card)') +
      '<h3 style="margin:14px 0 2px">Fixos x variáveis</h3>' + hb(by(t => t.kind === 'fixa' ? 'Fixos' : t.kind === 'variavel' ? 'Variáveis' : ''), 'var(--debt)') +
      '<h3 style="margin:14px 0 2px">Essenciais x supérfluos</h3>' + hb(by(t => t.need === 'essencial' ? 'Essenciais' : t.need === 'superfluo' ? 'Supérfluos' : ''), 'var(--warn)') +
      '<h3 style="margin:14px 0 2px">Por etiqueta</h3>' + hb((() => { const m = {}; ex.forEach(t => (t.tags || []).forEach(g => { m['#' + g] = r2((m['#' + g] || 0) + t.amount); })); return m; })(), 'var(--card)') +
      '<p class="sub" style="margin-top:12px">Juros e multas pagos no período: <b class="num ' + (fees > 0 ? 'out' : '') + '">' + money(fees) + '</b></p></section>';
  }
  // CSV
  h += '<section class="panel"><h2>Exportar lançamentos</h2><p class="sub" style="margin-bottom:10px">Gera um arquivo CSV com todos os lançamentos de ' + ymMM(ms[0]) + ' a ' + ymMM(ui.ym) + ', pronto para abrir no Excel.</p><button class="btn pri" data-a="csv-export">Exportar CSV do período</button></section>';
  return h + '</div>';
}

const modalEl = $('#modal'); const sheetEl = $('.sheet', modalEl); let lastFocus = null;
function openModal(title, body, foot) {
  if (modalEl.hidden) lastFocus = document.activeElement;
  $('#m-title').textContent = title; $('#m-body').innerHTML = body; $('#m-foot').innerHTML = foot || '';
  modalEl.hidden = false; document.body.classList.add('lock'); $('#m-body').scrollTop = 0;
  setTimeout(() => { try { sheetEl.focus(); } catch (e) { /* sem foco */ } }, 20);
}
function closeModal() {
  modalEl.hidden = true; document.body.classList.remove('lock'); ui.ctx = null;
  if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (e) { /* ignora */ } }
}
function toast(msg, isErr) {
  const el = document.createElement('div'); el.className = 'toast' + (isErr ? ' err' : ''); el.textContent = msg;
  $('#toasts').appendChild(el); setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 3800);
}

}

function clearErrs() { $$('.err', modalEl).forEach(e => { e.textContent = ''; }); $$('[aria-invalid]', modalEl).forEach(e => e.removeAttribute('aria-invalid')); }
function setErr(id, msg) { const e = $('#e-' + id); if (e) e.textContent = msg; const i = $('#' + id); if (i) i.setAttribute('aria-invalid', 'true'); }
function focusFirstErr() { const i = $('[aria-invalid="true"]', modalEl); if (i) { try { i.focus(); } catch (e) { /* ignora */ } } }

async function saveFile(filename, text) {
  if (!window.claude) {
    try {
      const blob = new Blob([text], { type: filename.slice(-4) === '.csv' ? 'text/csv;charset=utf-8' : 'application/json' });
      const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast('Arquivo gerado: ' + filename); return;
    } catch (e) { /* cai no texto para copiar */ }
  }
  let dl = null;
  try { if (window.claude && typeof window.claude.use === 'function') dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename, data: text }); toast('Arquivo salvo: ' + filename); return; }
    catch (e) { if (e && e.code === 'declined') return; if (e && e.code === 'rate_limited') { toast('Aguarde um instante e tente de novo.', true); return; } }
  }
  openModal('Copie o conteúdo', '<div class="note-box">Não foi possível baixar o arquivo neste navegador. Copie o texto abaixo e salve em um arquivo chamado <b>' + esc(filename) + '</b>.</div><textarea class="code" id="f-copy" readonly>' + esc(text) + '</textarea>', '<button class="btn" data-a="modal-close">Fechar</button><button class="btn pri" data-a="copy-text">Copiar texto</button>');
}

function go(tab) { ui.tab = tab; ui.cardView = null; ensureRecurring(ymMax(ui.ym, ymAdd(curYM(), 2))); render(); window.scrollTo(0, 0); }
function shiftMonth(n) { ui.ym = n === 0 ? curYM() : ymAdd(ui.ym, n); ensureRecurring(ymMax(ui.ym, ymAdd(curYM(), 2))); render(); }

/* =====================================================================
   18. EVENTOS (delegados)
   ===================================================================== */
function act(a, d) {
  switch (a) {
    case 'tab': go(d.tab); break;
    case 'ym-prev': shiftMonth(-1); break;
    case 'ym-next': shiftMonth(1); break;
    case 'ym-today': shiftMonth(0); break;
    case 'modal-close': closeModal(); break;
    case 'confirm-ok': { const cb = ui.ctx && ui.ctx.ok; closeModal(); if (cb) cb(); break; }
    // lançamentos
    case 'tx-new': openTxForm(null, { cardId: d.card || '' }); break;
    case 'tx-edit': openTxForm(d.id); break;
    case 'tx-del': askDelTx(d.id); break;
    case 'tx-paid': { const t = state.tx.find(x => x.id === d.id); if (t) { t.status = t.status === 'paid' ? 'pending' : 'paid'; if (t.status === 'paid') t.payDate = todayISO(); else delete t.payDate; save(); render(); } break; }
    case 'tx-save': saveTxForm(); break;
    case 'f-type': if (!ui.txForm.group) { const v = { cat: $('#f-cat').value, method: $('#f-method').value, card: $('#f-card').value, pig: $('#f-pig').value, inst: $('#f-inst').value, status: $('#f-status').value }; ui.txForm.type = d.v; fillTxSelects(v); refreshTxForm(); } break;
    case 'del-one': {
      const id = ui.ctx && ui.ctx.id; const t = state.tx.find(x => x.id === id); closeModal(); if (!t) break;
      if (t.recurId) { const r = state.recurs.find(x => x.id === t.recurId); if (r) r.skip.push(r.freq === 'week' ? t.date : ymOf(t.date)); }
      state.tx = state.tx.filter(x => x.id !== id); save(); toast('Lançamento excluído.'); render(); break;
    }
    case 'del-group': {
      const id = ui.ctx && ui.ctx.id; const t = state.tx.find(x => x.id === id); closeModal(); if (!t) break;
      const keep = state.tx.filter(x => x.group === t.group && x.status === 'paid').length;
      state.tx = state.tx.filter(x => !(x.group === t.group && x.status !== 'paid')); save();
      toast(keep ? 'Parcelas pendentes excluídas. As já pagas foram mantidas.' : 'Compra parcelada excluída.'); render(); break;
    }
    case 'del-future': {
      const id = ui.ctx && ui.ctx.id; const t = state.tx.find(x => x.id === id); closeModal(); if (!t) break;
      const r = state.recurs.find(x => x.id === t.recurId);
      state.tx = state.tx.filter(x => !(x.recurId === t.recurId && x.date >= t.date));
      if (r) { r.endDate = addDaysISO(t.date, -1); if (r.endDate < r.startDate) state.recurs = state.recurs.filter(x => x.id !== r.id); }
      save(); toast('Lançamento e próximos excluídos.'); render(); break;
    }
    // cartões
    case 'card-new': openCardForm(null); break;
    case 'card-edit': openCardForm(d.id); break;
    case 'card-save': saveCardForm(); break;
    case 'card-del': {
      const c = cardById(d.id); if (!c) break; const n = state.tx.filter(x => x.cardId === c.id).length;
      confirmBox('Excluir cartão?', n ? 'O cartão "' + c.name + '" e ' + n + ' lançamentos vinculados (compras e pagamentos de fatura) serão excluídos.' : 'O cartão "' + c.name + '" será excluído.', 'Excluir cartão', () => {
        state.tx = state.tx.filter(x => x.cardId !== c.id); state.cards = state.cards.filter(x => x.id !== c.id);
        state.recurs.forEach(r => { if (r.cardId === c.id) { r.method = 'pix'; delete r.cardId; } });
        Object.keys(state.invPaid).forEach(k => { if (k.split('|')[0] === c.id) delete state.invPaid[k]; });
        if (ui.cardView && ui.cardView.cardId === c.id) ui.cardView = null; save(); toast('Cartão excluído.'); render();
      }, true); break;
    }
    case 'card-view': { const c = cardById(d.id); if (!c) break; ui.tab = 'cartoes'; ui.cardView = { cardId: c.id, key: d.key || invKeyFor(c, todayISO()) }; render(); window.scrollTo(0, 0); break; }
    case 'inv-back': ui.cardView = null; render(); break;
    case 'inv-prev': ui.cardView.key = ymAdd(ui.cardView.key, -1); render(); break;
    case 'inv-next': ui.cardView.key = ymAdd(ui.cardView.key, 1); render(); break;
    case 'inv-pay': { if (state.accounts.length) { openPayInvoice(d.id, d.key); break; } const inv = invoice(d.id, d.key); if (inv && payInvoice(d.id, d.key)) { toast('Fatura paga: saída de ' + money(inv.total) + ' registrada.'); render(); } break; }
    case 'inv-reopen': reopenInvoice(d.id, d.key); toast('Fatura reaberta.'); render(); break;
    // dívidas
    case 'debt-new': openDebtForm(null); break;
    case 'debt-edit': openDebtForm(d.id); break;
    case 'debt-save': saveDebtForm(); break;
    case 'debt-del': {
      const x = state.debts.find(y => y.id === d.id); if (!x) break;
      confirmBox('Excluir dívida?', '"' + (x.desc || x.creditor) + '" e seu cronograma serão removidos. Saídas de parcelas já registradas continuam nos lançamentos.', 'Excluir dívida', () => { state.debts = state.debts.filter(y => y.id !== x.id); save(); toast('Dívida excluída.'); render(); }, true); break;
    }
    case 'debt-toggle': ui.openDebt = ui.openDebt === d.id ? null : d.id; render(); break;
    case 'pay-inst': openPayInst(d.id, +d.idx); break;
    case 'undo-inst': undoInstallment(d.id, +d.idx); toast('Pagamento desfeito.'); render(); break;
    case 'parc-view': ui.parcView = d.v; render(); break;
    // cofrinhos
    case 'pig-new': openPigForm(null); break;
    case 'pig-edit': openPigForm(d.id); break;
    case 'pig-save': savePigForm(); break;
    case 'pig-dep': openTxForm(null, { pigId: d.id, type: 'out' }); break;
    case 'pig-wd': openTxForm(null, { pigId: d.id, type: 'in' }); break;
    case 'pig-hist': ui.openPig = ui.openPig === d.id ? null : d.id; render(); break;
    case 'pig-del': {
      const p = state.pigs.find(x => x.id === d.id); if (!p) break;
      confirmBox('Excluir cofrinho?', '"' + p.name + '" será excluído. Os depósitos e resgates continuam nos Lançamentos, mas deixam de estar ligados a ele.', 'Excluir cofrinho', () => {
        state.tx.forEach(t => { if (t.pigId === p.id) delete t.pigId; }); state.recurs.forEach(r => { if (r.pigId === p.id) delete r.pigId; });
        state.pigs = state.pigs.filter(x => x.id !== p.id); save(); toast('Cofrinho excluído.'); render();
      }, true); break;
    }
    // contas e transferências
    case 'pat-view': ui.patView = d.v; render(); break;
    case 'acct-new': openAcctForm(null); break;
    case 'acct-edit': openAcctForm(d.id); break;
    case 'acct-save': saveAcctForm(); break;
    case 'acct-hist': ui.openAcct = ui.openAcct === d.id ? null : d.id; render(); break;
    case 'acct-del': {
      const a = acctById(d.id); if (!a) break; const n = state.tx.filter(x => x.accountId === a.id).length; const nt = state.transfers.filter(x => x.from === a.id || x.to === a.id).length;
      confirmBox('Excluir conta?', 'A conta "' + a.name + '" será excluída. Os ' + n + ' lançamentos ligados a ela continuam, sem conta vinculada, e ' + nt + ' transferências serão removidas.', 'Excluir conta', () => {
        state.tx.forEach(x => { if (x.accountId === a.id) delete x.accountId; }); state.recurs.forEach(r => { if (r.accountId === a.id) delete r.accountId; });
        state.pigs.forEach(p => { if (p.accountId === a.id) p.accountId = ''; }); state.cards.forEach(c => { if (c.accountId === a.id) c.accountId = ''; });
        state.transfers = state.transfers.filter(x => x.from !== a.id && x.to !== a.id); state.accounts = state.accounts.filter(x => x.id !== a.id); syncInitial(); save(); toast('Conta excluída.'); render();
      }, true); break;
    }
    case 'transfer-new': openTransferForm(null, d.from); break;
    case 'transfer-edit': openTransferForm(d.id); break;
    case 'tf-save': saveTransfer(); break;
    case 'transfer-del': confirmBox('Excluir transferência?', 'Ela será removida e os saldos das duas contas voltam ao que eram antes.', 'Excluir', () => { state.transfers = state.transfers.filter(x => x.id !== d.id); save(); toast('Transferência excluída.'); render(); }, true); break;
    case 'pi-save': savePayInvoice(); break;
    // novos recursos
    case 'f-newcat': ui.txForm.newCat = !ui.txForm.newCat; refreshTxForm(); if (ui.txForm.newCat) { const i = $('#f-newcat'); if (i) i.focus(); } break;
    case 'pick-emoji': { const i = $('#' + d.target); if (i) { i.value = d.e; i.focus(); } break; }
    case 'person-add': { const inp = $('#np-name'); const n = inp.value.trim(); if (!n) { toast('Digite o nome.', true); break; } if (state.people.some(p => norm(p) === norm(n))) { toast('Essa pessoa já existe.', true); break; } state.people.push(n.slice(0, 20)); save(); render(); break; }
    case 'person-del': state.people = state.people.filter(p => p !== d.c); save(); render(); break;
    case 'set-pal': state.settings.ui.palette = d.id; save(); applyTheme(); render(); break;
    case 'div-view': ui.divView = d.v; render(); break;
    case 'proj-n': ui.projN = +d.n; render(); break;
    case 'pay-save': savePayInst(); break;
    case 'debt-adv': openAdvance(d.id); break;
    case 'adv-all': { const c = ui.ctx; if (c) { $('#ad-n').value = c.rem; $('#ad-amount').value = numInput(r2(c.rem * c.inst)); } break; }
    case 'adv-save': saveAdvance(); break;
    // relatórios
    case 'rel-range': ui.relN = +d.n; render(); break;
    case 'csv-export': exportCSV(); break;
    // configurações
    case 'save-settings': {
      clearErrs(); const g = $('#s-goal').value.trim() === '' ? 0 : parseMoney($('#s-goal').value); const i = $('#s-init').value.trim() === '' ? 0 : parseMoney($('#s-init').value);
      if (!Number.isFinite(g) || g < 0) { setErr('s-goal', 'Informe um valor válido.'); break; }
      if (!Number.isFinite(i)) { setErr('s-init', 'Informe um valor válido.'); break; }
      const cd = parseMoney($('#s-cdi').value); if (!Number.isFinite(cd) || cd < 0 || cd > 100) { setErr('s-cdi', 'Informe o CDI anual, por exemplo 13,9.'); break; }
      state.settings.cdi = cd; state.settings.goal = g; state.settings.initial = i; state.settings.sampleVals = false;
      const idt = $('#s-initdate').value; state.settings.initialDate = isValidISO(idt) ? idt : (i !== 0 ? todayISO() : ''); save(); toast('Configurações salvas.'); render(); break;
    }
    case 'cat-new': openCatForm(d.t, null); break;
    case 'cat-edit': openCatForm(d.t, d.c); break;
    case 'cat-save': saveCatForm(); break;
    case 'cat-del': {
      const n = state.tx.filter(x => x.type === d.t && x.cat === d.c).length + state.recurs.filter(r => r.type === d.t && r.cat === d.c).length;
      if (n) { toast('"' + d.c + '" está em uso por ' + n + ' lançamentos. Mude a categoria deles antes.', true); break; }
      state.cats[d.t] = state.cats[d.t].filter(c => c !== d.c); save(); render(); break;
    }
    case 'rec-edit': openRecForm(d.id); break;
    case 'rec-save': saveRecForm(); break;
    case 'rec-toggle': { const r = state.recurs.find(x => x.id === d.id); if (r) { r.active = !r.active; if (r.active) ensureRecurring(ymAdd(curYM(), 2)); save(); render(); } break; }
    case 'rec-del': {
      const r = state.recurs.find(x => x.id === d.id); if (!r) break;
      confirmBox('Excluir recorrência?', '"' + r.desc + '" deixa de se repetir e os lançamentos futuros pendentes são removidos. Os já passados são mantidos.', 'Excluir', () => {
        const t0 = todayISO(); state.tx = state.tx.filter(x => !(x.recurId === r.id && x.date > t0 && x.status !== 'paid')); state.tx.forEach(x => { if (x.recurId === r.id) delete x.recurId; });
        state.recurs = state.recurs.filter(x => x.id !== r.id); save(); toast('Recorrência excluída.'); render();
      }, true); break;
    }
    // dados
    case 'export-json': exportJSON(); break;
    case 'import-json': openImport(); break;
    case 'do-import': doImport(); break;
    case 'clear-samples': confirmBox('Limpar dados de exemplo?', 'Os lançamentos, cartões, dívidas e recorrências de exemplo serão removidos. O que você cadastrou continua salvo.', 'Limpar exemplos', () => { clearSamples(); toast('Exemplos removidos.'); render(); }); break;
    case 'wipe': openWipe(); break;
    case 'do-wipe': doWipe(); break;
    case 'copy-text': {
      const ta = $('#f-copy'); if (!ta) break; ta.focus(); ta.select();
      try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(ta.value).then(() => toast('Texto copiado.'), () => { document.execCommand('copy'); toast('Texto copiado.'); }); } else { document.execCommand('copy'); toast('Texto copiado.'); } } catch (e) { toast('Selecione o texto e copie manualmente.', true); }
      break;
    }
    default: break;
  }
}
document.addEventListener('click', e => {
  if (e.target === modalEl) { closeModal(); return; }
  const el = e.target.closest ? e.target.closest('[data-a]') : null;
  if (!el || el.disabled) return;
  act(el.getAttribute('data-a'), el.dataset);
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'fl-q') { ui.f.q = e.target.value; const l = $('#txlist'); if (l) l.innerHTML = txListHTML(); }
  else if (id === 'f-amount' && ui.txForm && $('#f-method')) refreshTxForm();
});
document.addEventListener('change', e => {
  const id = e.target.id; const v = e.target.value;
  const L = { 'fl-acct': 'acct', 'fl-type': 'type', 'fl-cat': 'cat', 'fl-status': 'status', 'fl-sort': 'sort', 'fl-from': 'from', 'fl-to': 'to', 'fl-who': 'who' };
  if (L[id]) { ui.f[L[id]] = v; const l = $('#txlist'); if (l) l.innerHTML = txListHTML(); }
  else if (id === 'fl-period') { ui.f.period = v; render(); }
  else if (id && id.indexOf('f-') === 0) {
    if (ui.txForm && $('#f-method')) {
      if (id === 'f-pig' && v) { const pg = state.pigs.find(p => p.id === v); if (pg && pg.accountId && acctById(pg.accountId)) $('#f-acct').value = pg.accountId; }
      refreshTxForm();
    }
  }
  else if (id === 'ad-n') { const c = ui.ctx; const n = parseInt(v, 10); if (c && n >= 1 && n <= c.rem && $('#ad-amount')) $('#ad-amount').value = numInput(r2(n * c.inst)); }
  else if (id === 's-theme') { state.settings.theme = v; save(); applyTheme(); render(); }
  else if (['s-density', 's-font', 's-cards', 's-radius'].indexOf(id) >= 0) { state.settings.ui[id.slice(2)] = v; save(); applyTheme(); }
  else if (id === 'imp-file') {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    const rd = new FileReader(); rd.onload = () => { const ta = $('#imp-text'); if (ta) ta.value = String(rd.result || ''); }; rd.onerror = () => toast('Não foi possível ler o arquivo.', true); rd.readAsText(file);
  }
});
document.addEventListener('keydown', e => {
  if (modalEl.hidden) return;
  if (e.key === 'Escape') { closeModal(); return; }
  if (e.key === 'Tab') {
    const f = $$('button,input,select,textarea,[tabindex]:not([tabindex="-1"])', sheetEl).filter(x => !x.disabled && !x.closest('[hidden]'));
    if (!f.length) return; const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && (document.activeElement === first || document.activeElement === sheetEl)) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

/* =====================================================================
   19. INICIALIZAÇÃO
   ===================================================================== */
function init() {
  const had = loadState();
  if (!had) buildSample();
  if (!state) state = defaultState();
  applyTheme(); renderNav(); ensureRecurring(ymAdd(curYM(), 2)); render();
  if (window.matchMedia) { const mq = window.matchMedia('(prefers-color-scheme: dark)'); const cb = () => { if (state.settings.theme === 'auto') applyTheme(); }; if (mq.addEventListener) mq.addEventListener('change', cb); }
  const f = $('#saveflag'); if (f && !storageOK) f.textContent = 'Sem armazenamento: exporte um backup';
}
init();
})();

</script>
</body>
